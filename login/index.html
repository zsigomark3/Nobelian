<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Nobelian</title>
  <link rel="icon" type="image/jpeg" href="https://assets.nobelian.com/logos/nobelian_logo1.jpg" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/components.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/auth.js" defer></script>
</head>
<body id="top" data-page="login">

  <div data-component="navbar"></div>

  <main class="main-content auth-page">
    <div class="auth-container">
      <a href="/" class="back-link">← Back to Home</a>
      <h1>Login</h1>
      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="auth-button" id="submit-btn">Login</button>
      </form>
      <div class="auth-links">
        Don't have an account? <a href="/register/">Register here</a>
      </div>
    </div>
  </main>

  <div data-component="footer"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof authService === 'undefined') {
        setTimeout(() => {
          if (typeof authService !== 'undefined' && authService.isAuthenticated()) {
            window.location.href = "/";
          }
        }, 100);
      } else {
        if (authService.isAuthenticated()) {
          window.location.href = "/";
        }
      }
      document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (typeof authService === 'undefined') {
          document.getElementById("error-message").textContent = "Authentication service not loaded. Please refresh the page.";
          document.getElementById("error-message").classList.add("show");
          return;
        }
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const submitBtn = document.getElementById("submit-btn");
        const errorDiv = document.getElementById("error-message");
        const successDiv = document.getElementById("success-message");
        errorDiv.classList.remove("show");
        successDiv.classList.remove("show");
        submitBtn.disabled = true;
        submitBtn.textContent = "Logging in...";
        const result = await authService.login(email, password);
        if (result.success) {
          successDiv.textContent = "Login successful! Redirecting...";
          successDiv.classList.add("show");
          setTimeout(() => { window.location.href = "/"; }, 1000);
        } else {
          errorDiv.textContent = result.error || "Login failed. Please try again.";
          errorDiv.classList.add("show");
          submitBtn.disabled = false;
          submitBtn.textContent = "Login";
        }
      });
    });
  </script>
</body>
</html>
