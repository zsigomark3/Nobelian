<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Nobelian</title>
  <link rel="icon" type="image/jpeg" href="https://assets.nobelian.com/logos/nobelian_logo1.jpg" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/components.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/auth.js" defer></script>
</head>
<body id="top" data-page="register">

  <div data-component="navbar"></div>

  <main class="main-content auth-page">
    <div class="auth-container">
      <a href="/" class="back-link">← Back to Home</a>
      <h1>Register</h1>
      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>
      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8" />
          <span class="password-hint">Must be at least 8 characters</span>
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password" />
        </div>
        <button type="submit" class="auth-button" id="submit-btn">Register</button>
      </form>
      <div class="auth-links">
        Already have an account? <a href="/login/">Login here</a>
      </div>
    </div>
  </main>

  <div data-component="footer"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("register-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (typeof authService === 'undefined') {
          document.getElementById("error-message").textContent = "Authentication service not loaded. Please refresh the page.";
          document.getElementById("error-message").classList.add("show");
          return;
        }
        const username = document.getElementById("username").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirm-password").value;
        const submitBtn = document.getElementById("submit-btn");
        const errorDiv = document.getElementById("error-message");
        const successDiv = document.getElementById("success-message");
        errorDiv.classList.remove("show");
        successDiv.classList.remove("show");
        if (password !== confirmPassword) {
          errorDiv.textContent = "Passwords do not match.";
          errorDiv.classList.add("show");
          return;
        }
        if (password.length < 8) {
          errorDiv.textContent = "Password must be at least 8 characters.";
          errorDiv.classList.add("show");
          return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = "Registering...";
        const result = await authService.register(username, email, password);
        if (result.success) {
          successDiv.textContent = "Registration successful! Redirecting...";
          successDiv.classList.add("show");
          setTimeout(() => { window.location.href = "/"; }, 1000);
        } else {
          errorDiv.textContent = result.error || "Registration failed. Please try again.";
          errorDiv.classList.add("show");
          submitBtn.disabled = false;
          submitBtn.textContent = "Register";
        }
      });
    });
  </script>
</body>
</html>
