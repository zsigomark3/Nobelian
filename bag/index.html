  <script type="application/ld+json">

    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Bag Collection",
    "description": "Luxury handcrafted bag collection featuring premium Italian leather",

      "@type": "ItemList",
      "itemListElement": [
        {

          "name": "Nobelian Tote 01",

            "price": "280",
            "priceCurrency": "USD"
          }
        },
        {
          "@type": "Product",
          "name": "Structured Mini Bag",

            "@type": "Offer",
            "price": "310",
            "priceCurrency": "USD"
          }
        }
      ]
    }
  }

<body id="top" data-page="bag">
