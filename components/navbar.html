<!-- Reusable navbar + shop & stories overlays (inject into data-component="navbar") -->
<header class="navbar sticky">
  <div class="navbar-inner">
    <button
      class="nav-toggle nav-btn"
      type="button"
      aria-controls="navbar-menu"
      aria-expanded="false"
      aria-label="Open menu"
    >
      <span class="nav-toggle-icon" aria-hidden="true"></span>
    </button>

    <div class="nav-left" aria-label="Primary">
      <button class="nav-btn" onclick="toggleOverlay('shop-overlay')" data-i18n="common.nav.shop">Shop</button>
      <button class="nav-btn" onclick="toggleOverlay('stories-overlay')" data-i18n="common.nav.stories">Stories</button>
    </div>

    <div class="logo">
      <a href="/"><img src="https://assets.nobelian.com/logos/nobelian_logo1.jpg" alt="Nobelian Logo" class="logo-img" data-i18n-alt="common.images.logoAlt"></a>
    </div>

    <div class="nav-right">
      <select id="language-select" class="language-select" aria-label="Change language" data-i18n-aria-label="common.nav.languageSelectAria">
        <option value="en">EN</option>
        <option value="hu">HU</option>
        <option value="de">DE</option>
      </select>
      <a href="/cart/" class="nav-cart-link" aria-label="Shopping cart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span id="cart-badge" class="cart-badge" style="display:none;">0</span>
      </a>
      <div class="dropdown">
        <button class="nav-btn" data-i18n="common.nav.myAccount">My Account</button>
        <div class="dropdown-content">
          <a href="/login/" data-i18n="common.nav.login">Login</a>
          <a href="/register/" data-i18n="common.nav.register">Register</a>
        </div>
      </div>
    </div>
  </div>

  <nav id="navbar-menu" class="nav-menu" hidden aria-label="Menu">
    <div class="nav-menu-section">
      <button class="nav-btn nav-menu-item" type="button" onclick="toggleOverlay('shop-overlay')" data-i18n="common.nav.shop">Shop</button>
      <button class="nav-btn nav-menu-item" type="button" onclick="toggleOverlay('stories-overlay')" data-i18n="common.nav.stories">Stories</button>
    </div>
    <div class="nav-menu-section nav-menu-links">
      <a class="nav-menu-link" href="/cart/" data-i18n="common.nav.cart">Cart</a>
      <a class="nav-menu-link" href="/login/" data-i18n="common.nav.login">Login</a>
      <a class="nav-menu-link" href="/register/" data-i18n="common.nav.register">Register</a>
    </div>
  </nav>
</header>

<div id="shop-overlay" class="overlay">
  <div class="overlay-inner">
    <div class="overlay-column">
      <h3 data-i18n="common.overlay.shopByStyle">Shop by Style</h3>
      <a href="/bag/" data-i18n="common.overlay.links.bag">Bag</a>
      <a href="/scarf/" data-i18n="common.overlay.links.scarf">Scarf</a>
      <a href="/gloves/" data-i18n="common.overlay.links.gloves">Gloves</a>
      <a href="/charm/" data-i18n="common.overlay.links.charm">Charm</a>
    </div>
    <div class="overlay-column">
      <h3 data-i18n="common.overlay.shopByCollection">Shop by Collection</h3>
      <a href="/artcollection/" data-i18n="common.overlay.links.artCollection">Art Collection</a>
      <a href="/basiccollection/" data-i18n="common.overlay.links.basicCollection">Basic Collection</a>
    </div>
    <div class="overlay-image right-image">
      <img src="https://assets.nobelian.com/images/hero/overlay-img1.jpg" alt="Nobelian Shop Collection Preview" data-i18n-alt="common.images.shopOverlayAlt">
    </div>
  </div>
  <button class="overlay-close" onclick="closeOverlay('shop-overlay')">✕</button>
</div>

<div id="stories-overlay" class="overlay">
  <div class="overlay-inner">
    <div class="overlay-column">
      <h3 data-i18n="common.overlay.storiesTitle">Stories</h3>
      <a href="/stories/about/" data-i18n="common.overlay.links.about">About</a>
      <a href="/stories/material/" data-i18n="common.overlay.links.material">Material</a>
    </div>
    <div class="overlay-image right-image">
      <img src="https://assets.nobelian.com/images/hero/overlay-img1.jpg" alt="Nobelian Stories Collection" data-i18n-alt="common.images.storiesOverlayAlt">
    </div>
  </div>
  <button class="overlay-close" onclick="closeOverlay('stories-overlay')">✕</button>
</div>
