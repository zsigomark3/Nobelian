<!-- Reusable navbar + shop & stories overlays (inject into data-component="navbar") -->
<header class="navbar sticky">
  <div class="navbar-inner">
    <button
      class="nav-toggle nav-btn"
      type="button"
      aria-controls="navbar-menu"
      aria-expanded="false"
      aria-label="Open menu"
    >
      <span class="nav-toggle-icon" aria-hidden="true"></span>
    </button>

    <div class="nav-left" aria-label="Primary">
      <button class="nav-btn" onclick="toggleOverlay('shop-overlay')" data-i18n="common.nav.shop">Shop</button>
      <button class="nav-btn" onclick="toggleOverlay('stories-overlay')" data-i18n="common.nav.stories">Stories</button>
    </div>

    <div class="logo">
      <a href="/"><img src="https://assets.nobelian.com/logos/nobelian_logo_horizontal.svg" alt="Nobelian Logo" class="logo-img" data-i18n-alt="common.images.logoAlt"></a>
    </div>

    <div class="nav-right">
      <button class="nav-search-btn" id="nav-search-btn" type="button" aria-label="Search products" data-i18n-aria-label="common.nav.searchAria">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      <a href="/cart/" class="nav-cart-link" aria-label="Shopping cart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span id="cart-badge" class="cart-badge" style="display:none;">0</span>
      </a>
      <button class="nav-btn nav-account-btn" aria-label="My Account" data-i18n-aria-label="common.nav.myAccount" onclick="toggleAccountPanel()">
        <img src="https://assets.nobelian.com/icons/nobelian_pict.svg" alt="Account" class="nav-account-icon">
      </button>
    </div>
  </div>

  <nav id="navbar-menu" class="nav-menu" hidden aria-label="Menu">
    <div class="nav-menu-section">
      <button class="nav-btn nav-menu-item" type="button" onclick="toggleOverlay('shop-overlay')" data-i18n="common.nav.shop">Shop</button>
      <button class="nav-btn nav-menu-item" type="button" onclick="toggleOverlay('stories-overlay')" data-i18n="common.nav.stories">Stories</button>
    </div>
    <div class="nav-menu-section nav-menu-links">
      <a class="nav-menu-link" href="/cart/" data-i18n="common.nav.cart">Cart</a>
      <button class="nav-btn nav-menu-link" type="button" onclick="toggleAccountPanel()" data-i18n="common.nav.myAccount">My Account</button>
    </div>
  </nav>
</header>

<div id="shop-overlay" class="overlay">
  <div class="overlay-inner">
    <div class="overlay-column">
      <h3 data-i18n="common.overlay.shopByStyle">Shop by Style</h3>
      <a href="/bag/" data-i18n="common.overlay.links.bag">Bag</a>
      <a href="/scarf/" data-i18n="common.overlay.links.scarf">Scarf</a>
      <a href="/gloves/" data-i18n="common.overlay.links.gloves">Gloves</a>
      <a href="/charm/" data-i18n="common.overlay.links.charm">Charm</a>
    </div>
    <div class="overlay-column">
      <h3 data-i18n="common.overlay.shopByCollection">Shop by Collection</h3>
      <a href="/artcollection/" data-i18n="common.overlay.links.artCollection">Art Collection</a>
      <a href="/basiccollection/" data-i18n="common.overlay.links.basicCollection">Basic Collection</a>
    </div>
    <div class="overlay-image right-image">
      <img src="https://assets.nobelian.com/images/hero/overlay-img1.jpg" alt="Nobelian Shop Collection Preview" data-i18n-alt="common.images.shopOverlayAlt">
    </div>
  </div>
  <button class="overlay-close" onclick="closeOverlay('shop-overlay')">✕</button>
</div>

<div id="stories-overlay" class="overlay">
  <div class="overlay-inner">
    <div class="overlay-column">
      <h3 data-i18n="common.overlay.storiesTitle">Stories</h3>
      <a href="/stories/about/" data-i18n="common.overlay.links.about">About</a>
      <a href="/stories/material/" data-i18n="common.overlay.links.material">Material</a>
    </div>
    <div class="overlay-image right-image">
      <img src="https://assets.nobelian.com/images/hero/overlay-img1.jpg" alt="Nobelian Stories Collection" data-i18n-alt="common.images.storiesOverlayAlt">
    </div>
  </div>
  <button class="overlay-close" onclick="closeOverlay('stories-overlay')">✕</button>
</div>

<!-- Account slide-in panel -->
<div id="account-panel-overlay" class="account-panel-overlay" onclick="closeAccountPanel()"></div>
<aside id="account-panel" class="account-panel" aria-label="My Account">
  <div class="account-panel-header">
    <span class="account-panel-title" data-i18n="common.nav.myAccount">My Account</span>
    <button class="account-panel-close" onclick="closeAccountPanel()" aria-label="Close">✕</button>
  </div>

  <!-- Tabs (only visible when logged out) -->
  <div id="account-panel-tabs" class="account-panel-tabs">
    <button class="account-tab active" data-tab="login" onclick="switchAccountTab('login')" data-i18n="common.nav.login">Login</button>
    <button class="account-tab" data-tab="register" onclick="switchAccountTab('register')" data-i18n="common.nav.register">Register</button>
  </div>

  <!-- Login form -->
  <div id="account-tab-login" class="account-tab-content active">
    <div id="panel-login-error" class="error-message"></div>
    <div id="panel-login-success" class="success-message"></div>
    <form id="panel-login-form" class="account-panel-form">
      <div class="form-group">
        <label for="panel-login-email">Email</label>
        <input type="email" id="panel-login-email" name="email" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="panel-login-password">Password</label>
        <input type="password" id="panel-login-password" name="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="auth-button" id="panel-login-btn">Login</button>
    </form>
  </div>

  <!-- Register form -->
  <div id="account-tab-register" class="account-tab-content">
    <div id="panel-register-error" class="error-message"></div>
    <div id="panel-register-success" class="success-message"></div>
    <form id="panel-register-form" class="account-panel-form">
      <div class="form-group">
        <label for="panel-register-username">Username</label>
        <input type="text" id="panel-register-username" name="username" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="panel-register-email">Email</label>
        <input type="email" id="panel-register-email" name="email" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="panel-register-password">Password</label>
        <input type="password" id="panel-register-password" name="password" required autocomplete="new-password" minlength="8" />
        <span class="password-hint">Must be at least 8 characters</span>
      </div>
      <div class="form-group">
        <label for="panel-register-confirm">Confirm Password</label>
        <input type="password" id="panel-register-confirm" name="confirm-password" required autocomplete="new-password" />
      </div>
      <button type="submit" class="auth-button" id="panel-register-btn">Register</button>
    </form>
  </div>

  <!-- Logged-in state -->
  <div id="account-panel-logged-in" class="account-tab-content" style="display:none;">
    <nav class="account-panel-nav">
      <a href="/orders/" data-i18n="common.nav.orders">My Orders</a>
      <a href="#" onclick="authService.logout(); closeAccountPanel(); return false;" data-i18n="common.nav.logout">Logout</a>
    </nav>
  </div>
</aside>

<!-- Search overlay -->
<div id="search-overlay" class="search-overlay">
  <div class="search-overlay-inner">
    <div class="search-input-wrapper">
      <svg class="search-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="search" id="search-input" class="search-input" placeholder="Search products..." autocomplete="off" data-i18n-placeholder="common.nav.searchPlaceholder">
      <button class="search-close-btn" id="search-close-btn" type="button" aria-label="Close search">✕</button>
    </div>
    <div id="search-results" class="search-results"></div>
  </div>
</div>
